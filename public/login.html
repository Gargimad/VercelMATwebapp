<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - JCHS Mu Alpha Theta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
    .oauth-btn { background: #4285F4; margin-top: 5px; }
    .ms-btn { background: #2f2f2f; }
    .toggle-link { font-size: 12px; color: #007BFF; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="title">Sign In</h2>
  
  <form id="auth-form">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit" id="submit-btn">Log In</button>
  </form>

  <hr />

  <button class="oauth-btn" onclick="loginWithOAuth('google')">Sign in with Google</button>
  <button class="oauth-btn ms-btn" onclick="loginWithOAuth('azure')">Sign in with Microsoft</button>

  <p style="margin-top: 15px;">
    <span class="toggle-link" id="toggle-auth" onclick="toggleAuthMode()">Need an account? Sign Up</span>
  </p>
</div>

<script>
  // Initialize Supabase Client directly in browser
  // Replace these strings with your real public credentials
  const SUPABASE_URL = "YOUR_SUPABASE_URL"; 
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; 
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isSignUp = false;

  function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('title').innerText = isSignUp ? 'Sign Up' : 'Sign In';
    document.getElementById('submit-btn').innerText = isSignUp ? 'Register' : 'Log In';
    document.getElementById('toggle-auth').innerText = isSignUp ? 'Already have an account? Log In' : 'Need an account? Sign Up';
  }

  // Handle Form Submission
  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (isSignUp) {
      // 1. Sign Up User
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return alert(error.message);
      
      // Send token to backend to determine if onboarding is needed
      handleAuthSuccess(data.session.access_token);
    } else {
      // 2. Log In User
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return alert(error.message);

      handleAuthSuccess(data.session.access_token);
    }
  });

  // OAuth Handler (Google / Microsoft)
  async function loginWithOAuth(provider) {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: provider, // 'google' or 'azure' (Microsoft)
      options: { redirectTo: window.location.origin + '/auth/callback' }
    });
    if (error) alert(error.message);
  }

  // Send Token to Server to handle redirection
  async function handleAuthSuccess(accessToken) {
    window.location.href = `/auth/verify?token=${accessToken}`;
  }
</script>

</body>
</html>
