<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - JCHS Math Tutoring</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Rowdies:wght@300;400;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- Back to Home -->
      <a href="index.html" class="back-button">
        Go Back to Home
      </a>

      <!-- Page Title -->
      <h2 id="title">
        Enter your Student ID
      </h2>

      <!-- Alert Messages -->
      <div id="alert-container"></div>

      <!-- Login Form -->
      <form id="auth-form">

        <input
          type="text"
          id="student-id"
          placeholder="Student ID"
          aria-label="Student ID"
          autocomplete="off"
          required
        >

        <button
          type="submit"
          id="submit-btn"
          class="btn-primary"
        >
          Log In
        </button>

      </form>

      <!-- Sign Up -->
      <p id="account-toggle">
        <span class="account-text">
          Don't have an account?
        </span>

        <a href="signup.html" class="toggle-link">
          Sign Up
        </a>
      </p>

    </div>

  </div>

  <!-- Shared Authentication JavaScript -->
  <script src="js/login.js"></script>

</body>
</html>
