<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - TutorConnect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Luxury Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1a1a2e;
      --secondary: #16213e;
      --accent: #c9a96e;
      --gold: #d4a853;
      --gold-light: #e8d5a3;
      --cream: #faf7f2;
      --charcoal: #2d2d2d;
      --slate: #4a4a4a;
      --white: #ffffff;
      --off-white: #f8f6f0;
      --border-light: #e5e0d5;
      --shadow-sm: 0 2px 20px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: linear-gradient(135deg, #faf7f2 0%, #f1ece1 50%, #e8e0d0 100%);
      margin: 0; 
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* Background Animation */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(201, 169, 110, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, rgba(26, 26, 46, 0.05) 0%, transparent 50%);
      animation: bgFloat 20s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(1deg); }
      66% { transform: translate(-20px, 20px) rotate(-1deg); }
    }

    .card { 
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 45px 40px; 
      border-radius: 24px; 
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15),
                  0 0 0 1px rgba(201, 169, 110, 0.2);
      width: 380px; 
      text-align: center;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Decorative top accent */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* Brand Section */
    .brand-section {
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(26, 26, 46, 0.3);
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: var(--gold);
      font-weight: 700;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--slate);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    h2 { 
      font-family: 'Playfair Display', serif;
      margin: 0 0 25px 0; 
      color: var(--primary);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    input { 
      width: 100%; 
      padding: 13px 16px; 
      margin: 8px 0; 
      border-radius: 12px; 
      border: 2px solid var(--border-light); 
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: var(--transition);
      background: var(--off-white);
      color: var(--charcoal);
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(201, 169, 110, 0.1);
      transform: translateY(-1px);
    }

    input::placeholder {
      color: #b0a89a;
      font-weight: 300;
    }

    button { 
      width: 100%; 
      padding: 13px; 
      margin: 8px 0; 
      border-radius: 12px; 
      border: none; 
      box-sizing: border-box;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:active::after {
      width: 300px;
      height: 300px;
    }

    #submit-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--gold);
      border: 1px solid rgba(201, 169, 110, 0.3);
      box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
      font-weight: 600;
      font-size: 15px;
    }

    #submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(26, 26, 46, 0.4);
      background: linear-gradient(135deg, var(--secondary), #0f1a2e);
    }

    #submit-btn:disabled { 
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
    }

    .secondary-btn { 
      background: transparent;
      color: var(--slate);
      border: 2px solid var(--border-light);
      font-weight: 500;
    }

    .secondary-btn:hover { 
      background: var(--off-white);
      border-color: var(--gold);
      color: var(--charcoal);
      transform: translateY(-2px);
    }

    .oauth-btn { 
      background: var(--white);
      color: var(--charcoal);
      border: 2px solid var(--border-light);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
    }

    .oauth-btn:hover { 
      border-color: var(--gold);
      background: var(--off-white);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .ms-btn { 
      background: var(--white);
      color: var(--charcoal);
      border: 2px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .ms-btn:hover { 
      border-color: var(--gold);
      background: var(--off-white);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    hr { 
      margin: 20px 0; 
      border: none; 
      border-top: 1px solid var(--border-light);
      position: relative;
    }

    hr::before {
      content: 'or';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 0 15px;
      color: var(--slate);
      font-size: 12px;
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .toggle-link { 
      font-size: 13px; 
      color: var(--accent); 
      cursor: pointer; 
      text-decoration: none;
      display: inline-block; 
      margin: 4px 0;
      font-weight: 500;
      transition: var(--transition);
      font-family: 'Outfit', sans-serif;
    }

    .toggle-link:hover { 
      color: var(--gold);
      text-decoration: underline;
    }

    .hidden { display: none !important; }

    p {
      color: var(--slate);
      font-size: 14px;
      font-weight: 400;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 35px 25px;
        width: 100%;
        border-radius: 20px;
      }

      h2 {
        font-size: 24px;
      }

      .brand-icon {
        width: 45px;
        height: 45px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Brand Section -->
  <div class="brand-section">
    <div class="brand-icon">TC</div>
    <div class="brand-name">TutorConnect</div>
  </div>

  <h2 id="title">Sign In</h2>
  
  <form id="auth-form">
    <input type="email" id="email" placeholder="Email" required />
    
    <div id="password-group">
      <input type="password" id="password" placeholder="Password" />
      <div style="text-align: right;">
        <span class="toggle-link" onclick="setMode('reset')">Forgot Password?</span>
      </div>
    </div>

    <input type="text" id="otp-token" class="hidden" placeholder="Enter 6-digit OTP Code" />

    <button type="submit" id="submit-btn" disabled>Log In</button>
  </form>

  <hr />

  <div id="oauth-group">
    <button class="oauth-btn" type="button" onclick="loginWithOAuth('google')">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <button class="oauth-btn ms-btn" type="button" onclick="loginWithOAuth('azure')">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
        <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
        <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
        <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
      </svg>
      Sign in with Microsoft
    </button>
    <button class="secondary-btn" type="button" onclick="setMode('otp')">Send One-Time Passcode (OTP)</button>
    <hr />
  </div>

  <p style="margin-top: 10px;">
    <span class="toggle-link" id="toggle-auth" onclick="toggleAuthMode()">Need an account? Sign Up</span>
  </p>
</div>

<script>
  var supabase = supabase || null;
  // Modes: 'signin', 'signup', 'reset', 'otp', 'verify-otp'
  var currentMode = 'signin';

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const response = await fetch('/api/config');
      const config = await response.json();
      
      supabase = window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey);

      const submitBtn = document.getElementById("submit-btn");
      if (submitBtn) submitBtn.disabled = false;
    } catch (err) {
      console.error("Failed to load environment credentials:", err);
    }
  });

  // Switch between Form Modes
  function setMode(mode) {
    currentMode = mode;
    const title = document.getElementById('title');
    const submitBtn = document.getElementById('submit-btn');
    const passwordGroup = document.getElementById('password-group');
    const otpInput = document.getElementById('otp-token');
    const oauthGroup = document.getElementById('oauth-group');
    const toggleAuth = document.getElementById('toggle-auth');
    const passwordInput = document.getElementById('password');

    // Reset visibility
    passwordGroup.classList.remove('hidden');
    otpInput.classList.add('hidden');
    oauthGroup.classList.remove('hidden');
    passwordInput.required = true;

    if (mode === 'signin') {
      title.innerText = 'Sign In';
      submitBtn.innerText = 'Log In';
      toggleAuth.innerText = 'Need an account? Sign Up';
    } else if (mode === 'signup') {
      title.innerText = 'Sign Up';
      submitBtn.innerText = 'Register';
      toggleAuth.innerText = 'Already have an account? Log In';
    } else if (mode === 'reset') {
      title.innerText = 'Reset Password';
      submitBtn.innerText = 'Send Reset Email';
      passwordGroup.classList.add('hidden');
      oauthGroup.classList.add('hidden');
      passwordInput.required = false;
      toggleAuth.innerText = '← Back to Log In';
    } else if (mode === 'otp') {
      title.innerText = 'OTP Verification';
      submitBtn.innerText = 'Send OTP Passcode';
      passwordGroup.classList.add('hidden');
      oauthGroup.classList.add('hidden');
      passwordInput.required = false;
      toggleAuth.innerText = '← Back to Log In';
    } else if (mode === 'verify-otp') {
      title.innerText = 'Enter OTP Code';
      submitBtn.innerText = 'Verify & Log In';
      passwordGroup.classList.add('hidden');
      otpInput.classList.remove('hidden');
      oauthGroup.classList.add('hidden');
      passwordInput.required = false;
      toggleAuth.innerText = '← Back to Log In';
    }
  }

  function toggleAuthMode() {
    if (currentMode === 'signin') {
      setMode('signup');
    } else {
      setMode('signin');
    }
  }

  // Handle Form Submission
  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!supabase) return alert("System initializing, please wait a moment...");

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const token = document.getElementById('otp-token').value;

    if (currentMode === 'signup') {
      // Sign Up Flow
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return alert(error.message);
      
      if (data.session) {
        handleAuthSuccess(data.session.access_token);
      } else {
        alert("Check your email for the confirmation link!");
      }

    } else if (currentMode === 'signin') {
      // Standard Password Login
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return alert(error.message);

      handleAuthSuccess(data.session.access_token);

    } else if (currentMode === 'reset') {
      // Forgot Password Flow
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/auth/verify'
      });
      if (error) return alert(error.message);
      
      alert("Password reset email sent! Check your inbox.");
      setMode('signin');

    } else if (currentMode === 'otp') {
      // Send OTP Passcode
      const { error } = await supabase.auth.signInWithOtp({ email });
      if (error) return alert(error.message);

      alert("A one-time passcode has been sent to your email!");
      setMode('verify-otp');

    } else if (currentMode === 'verify-otp') {
      // Verify OTP Code
      const { data, error } = await supabase.auth.verifyOtp({
        email,
        token,
        type: 'email'
      });
      if (error) return alert(error.message);

      handleAuthSuccess(data.session.access_token);
    }
  });

  // OAuth Handler
  async function loginWithOAuth(provider) {
    if (!supabase) return alert("System initializing, please wait a moment...");

    const { error } = await supabase.auth.signInWithOAuth({
      provider: provider,
      options: { redirectTo: window.location.origin + '/auth/verify' }
    });
    if (error) alert(error.message);
  }

  function handleAuthSuccess(accessToken) {
    window.location.href = `/auth/verify?token=${accessToken}`;
  }
</script>

</body>
</html>
